# Conda environment for SPARSH.
#
#   conda env create -f envs/sparsh.yml          (mamba or micromamba work the same way)
#   conda activate sparsh
#   bash tests/run_all.sh
#
# conda-forge installs a PyTorch build with CUDA when the machine has an NVIDIA driver, and a CPU build otherwise;
# only training needs the GPU. samtools (1.17 or later, for samtools reset), modkit and minimap2 are used by the
# single-sample pipeline and samtools also by the copy-number step; Optuna is used only by scripts/tune.py. dorado,
# the other aligner of the pipeline, is not packaged for conda and is installed from Oxford Nanopore's releases.
name: sparsh
channels:
  - conda-forge
  - bioconda
dependencies:
  - python >=3.10,<3.14
  - pytorch >=2.0
  - numpy >=1.24
  - pandas >=2.0
  - scipy >=1.10
  - scikit-learn >=1.3
  - matplotlib-base >=3.7
  - samtools >=1.17
  - ont-modkit 0.6.1
  - minimap2 >=2.24
  - optuna >=3.6
