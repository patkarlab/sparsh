# R environment for figures/dmr.R, which finds differentially methylated regions with DMRcate.
#
#   conda env create -f envs/figures_r.yml          (mamba or micromamba work the same way)
#   conda activate sparsh_figures_r
#   Rscript figures/dmr.R --help
#
# Only dmr.R needs it; the Python figure scripts run in the usual environment. dmr.R places the CpGs from the
# annotation written by scripts/cpg_annotation.py, so no array annotation package and no internet access are needed.
# Tested with R 4.5 and DMRcate 3.6.0.
name: sparsh_figures_r
channels:
  - conda-forge
  - bioconda
dependencies:
  - r-base >=4.3
  - bioconductor-dmrcate
